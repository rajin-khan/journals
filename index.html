<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description" content="Explore Rajin's public-facing leather journal in 3D. Open the cover and turn through its pages." />
    <meta name="author" content="Rajin Khan" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="./assets/favicon.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./assets/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rajin's Journals" />
    <meta property="og:title" content="rajin's journal (I)" />
    <meta property="og:description" content="Explore Rajin's public-facing leather journal in 3D. Open the cover and turn through its pages." />
    <meta property="og:image" content="./og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rajin's sticker-covered navy leather journal beside the title rajin's journal (I)" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="rajin's journal (I)" />
    <meta name="twitter:description" content="Explore Rajin's public-facing leather journal in 3D. Open the cover and turn through its pages." />
    <meta name="twitter:image" content="./og-image.png" />
    <meta name="twitter:image:alt" content="Rajin's sticker-covered navy leather journal beside the title rajin's journal (I)" />
    <link rel="stylesheet" href="./styles.css?v=23" />
  </head>
  <body>
    <div class="site-shell">
      <header class="masthead"><h1 class="masthead-title">Rajin's Journals</h1><span class="volume">vol. I</span></header>

      <main class="main-content">
        <section class="viewer" aria-label="Interactive three-dimensional journal">
          <div class="ambient ambient-one" aria-hidden="true"></div>
          <div class="ambient ambient-two" aria-hidden="true"></div>
          <div class="scene" id="scene">
            <div class="book-shadow" aria-hidden="true"></div>
            <div class="book-motion" id="bookMotion">
              <div class="book" id="book">
                <div class="back-cover cover" aria-hidden="true">
                  <span class="cover-edge edge-free"></span>
                  <span class="cover-edge edge-top"></span>
                  <span class="cover-edge edge-bottom"></span>
                  <div class="cover-face outside"><span class="stitches"></span></div>
                  <div class="cover-face inside"><span class="stitches"></span></div>
                </div>
                <div class="spine" aria-hidden="true"></div>
                <div class="paper-block" aria-hidden="true"><span class="paper-block-top"></span><span class="paper-block-bottom"></span></div>
                <div class="last-page paper-face" id="lastPage" aria-hidden="true"></div>
                <div class="ribbon" aria-hidden="true"></div>
                <div class="sheets" id="sheets"></div>
                <div class="binding-seam" aria-hidden="true"></div>
                <button class="front-cover cover" id="coverButton" type="button" aria-label="Open journal">
                  <span class="cover-edge edge-free"></span>
                  <span class="cover-edge edge-top"></span>
                  <span class="cover-edge edge-bottom"></span>
                  <span class="cover-face outside"><span class="stitches"></span><span class="sticker-layer" id="stickerLayer" aria-hidden="true"></span><span class="cover-sheen"></span></span>
                  <span class="cover-face inside"><span class="stitches"></span></span>
                </button>
                <div class="strap" aria-hidden="true">
                  <div class="strap-anchor"></div>
                  <div class="strap-wrap">
                    <div class="strap-flap"><span class="snap"></span><span class="strap-sticker"></span></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
      <footer class="site-footer">
        <button class="toggle-button" id="toggleButton" type="button" aria-controls="book" aria-expanded="false" aria-label="Open journal" data-phase="closed">
          <span class="toggle-label" data-label="closed" aria-hidden="true">Open journal</span>
          <span class="toggle-label" data-label="opening" aria-hidden="true">Opening…</span>
          <span class="toggle-label" data-label="open" aria-hidden="true">Close journal</span>
          <span class="toggle-label" data-label="closing" aria-hidden="true">Closing…</span>
        </button>
        <a class="portfolio-link" href="https://rajinkhan.com">home</a>
      </footer>
    </div>
    <dialog class="viewport-notice" id="viewportNotice" aria-labelledby="viewportNoticeTitle" aria-describedby="viewportNoticeText">
      <h2 id="viewportNoticeTitle">Best on a larger screen</h2>
      <p id="viewportNoticeText">The journal is easier to open and read on a laptop, desktop, or iPad. You can still explore it here.</p>
      <form method="dialog"><button type="submit">View journal here</button></form>
    </dialog>
    <script src="./script.js?v=23" defer></script>
  </body>
</html>
