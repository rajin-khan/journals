<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>rajin's journal (I) — social image</title>
    <style>
      @font-face { font-family: Satoshi; src: url('./assets/fonts/satoshi-400.woff2') format('woff2'); font-weight: 400; }
      @font-face { font-family: Satoshi; src: url('./assets/fonts/satoshi-500.woff2') format('woff2'); font-weight: 500; }
      @font-face { font-family: 'La Belle Aurore'; src: url('./assets/fonts/la-belle-aurore-latin.woff2') format('woff2'); }
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body { background: #000; color: #f1eee8; font-family: Satoshi, sans-serif; }
      main { position: relative; width: 1200px; height: 630px; overflow: hidden; }
      .eyebrow { position: absolute; top: 70px; left: 78px; margin: 0; color: #989b9c; font-size: 16px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; }
      h1 { position: absolute; top: 163px; left: 68px; margin: 0; font-weight: 400; line-height: .88; }
      h1 .hand { display: block; margin-left: 9px; font-family: 'La Belle Aurore', cursive; font-size: 118px; transform: rotate(-3deg); }
      h1 .solid { display: inline-block; margin-top: 17px; font-size: 116px; letter-spacing: -.075em; }
      h1 .volume { display: inline-block; margin-left: 16px; font-size: 45px; letter-spacing: -.04em; vertical-align: 15px; }
      .description { position: absolute; top: 484px; left: 79px; width: 540px; margin: 0; color: #aaaeb1; font-size: 22px; line-height: 1.4; }
      .book { position: absolute; top: 11px; right: 69px; width: 365px; height: auto; }
      .edge { position: absolute; left: 78px; bottom: 54px; color: #787e83; font-size: 13px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">A PUBLIC-FACING JOURNAL</p>
      <h1><span class="hand">rajin's</span><span class="solid">journal</span><span class="volume">(I)</span></h1>
      <p class="description">Pages from a real journal, made to be opened and explored.</p>
      <span class="edge">RAJIN KHAN&nbsp;&nbsp; / &nbsp;&nbsp;VOL. I</span>
      <img class="book" src="./assets/og-journal.jpg" alt="A navy leather journal covered in stickers" />
    </main>
  </body>
</html>
